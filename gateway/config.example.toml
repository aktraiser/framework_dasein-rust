# Optional LLM configuration. No real API key belongs in this file.
[server]
host = "127.0.0.1"
port = 8080
cors_origins = []

[llm.providers.openai]
api_key = "${OPENAI_API_KEY}"
enabled = true

# Replace with a model enabled for your account.
[llm.models.gpt-4o-mini]
provider = "openai"
fallbacks = []

[sandbox]
# Docker Python Boxes use DASEIN_BOX_IMAGE or python:3.12-alpine.

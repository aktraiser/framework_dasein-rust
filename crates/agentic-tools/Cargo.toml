[package]
name = "dasein-agentic-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Built-in tools for the Agentic Framework (search, Gmail, Calendar, Drive)"

[features]
default = ["search"]
all = ["search", "google"]
search = ["dep:reqwest"]
google = []

[dependencies]
# Core
dasein-agentic-llm = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# HTTP (for Tavily search)
reqwest = { workspace = true, optional = true }

[lints]
workspace = true

[package]
name = "dasein-agentic-core"
description = "Core types, Agent runtime, and Protocol for Agentic Framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dasein-agentic-core"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Enable Redis-backed checkpoint persistence
redis-persistence = ["redis"]
# Serve the runtime's metrics to Prometheus
prometheus = ["dep:metrics-exporter-prometheus"]
# Export the runtime's tracing spans to an OpenTelemetry collector (OTLP/HTTP)
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
# Async
tokio = { workspace = true }
tokio-stream = "0.1"
async-trait = { workspace = true }
async-stream = "0.3"
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Metrics (no-op until the application installs a recorder)
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"], optional = true }

# Trace export (optional)
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Validation
validator = { workspace = true }

# Utils
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
md5 = { workspace = true }

# Message Bus
async-nats = { workspace = true }

# HTTP (for MCP doc validator)
reqwest = { workspace = true }

# Redis (optional - for persistent checkpoints)
redis = { workspace = true, optional = true }

# Internal
dasein-agentic-llm = { workspace = true, features = ["gemini", "openai", "anthropic"] }
dasein-agentic-sandbox = { workspace = true }

[dev-dependencies]
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing-subscriber = { workspace = true }
tokio-test = { workspace = true }
mockall = { workspace = true }

[lints]
workspace = true
